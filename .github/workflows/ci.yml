name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Save browser diagnostics including retried failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: test-results/
          retention-days: 7
      - run: docker build -t thinking-board:ci .
      - name: Smoke-test container, persistent data and local Stockfish
        run: |
          docker run --rm --network none thinking-board:ci node scripts/smoke-opening-stockfish.mjs > stockfish-smoke.json
          docker run --rm --network none thinking-board:ci node scripts/smoke-app-reliability.mjs > app-reliability-smoke.json
          docker volume create thinking-board-ci-data
          docker run -d --name thinking-board-ci -p 127.0.0.1:18000:8000 -v thinking-board-ci-data:/app/data thinking-board:ci
          node scripts/container-smoke.mjs http://127.0.0.1:18000
          docker restart thinking-board-ci
          node scripts/container-smoke.mjs http://127.0.0.1:18000 --existing --clear-library
          docker restart thinking-board-ci
          node scripts/container-smoke.mjs http://127.0.0.1:18000 --cleared
      - name: Save real-engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-smoke-evidence
          path: |
            stockfish-smoke.json
            app-reliability-smoke.json
          retention-days: 7
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs thinking-board-ci || true
          docker rm -f thinking-board-ci || true
          docker volume rm thinking-board-ci-data || true
